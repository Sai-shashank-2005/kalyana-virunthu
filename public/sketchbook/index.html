<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Beautiful Moments | Santhosh Ananth &amp; Shunmugapriya</title>
<meta name="description" content="A candid collection of beautiful casual moments and memories of Santhosh Ananth &amp; Shunmugapriya">
<style>
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:block;
  src:url(./instrument-serif.woff2) format('woff2')}
@font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;font-display:block;
  src:url(./instrument-serif-italic.woff2) format('woff2')}
@font-face{font-family:'Newsreader';font-style:normal;font-weight:200 600;font-display:swap;
  src:url(./newsreader.woff2) format('woff2')}

:root{
  --paper:#ece7dc;
  --ink:#2b2721;
  --ink-soft:rgba(43,39,33,.68);
  --ink-faint:rgba(43,39,33,.45);
  --hairline:rgba(43,39,33,.14);
  --maroon:#6a252b;
  --gold:#b08d57;
  --gold-light:#e2d4bc;
  --display:'Instrument Serif',"New York",Georgia,'Times New Roman',serif;
  --font:'Newsreader',"New York",Georgia,'Times New Roman',serif;
  --track-caps:.22em;
  --track-nav:.06em;
}

*{box-sizing:border-box}
html,body{
  margin:0;padding:0;width:100%;height:100%;overflow:hidden;
  font-family:var(--font);font-weight:400;background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
::selection{background:rgba(106,37,43,.85);color:#fff}

/* the painted ground texture */
.wash{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:url(./bg-wash.jpg) center center / cover no-repeat;
  opacity:.85;
}
.wash:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(236,231,220,.25) 0%,rgba(236,231,220,.72) 58%,var(--paper) 88%);
}

/* ---------------- sketchbook hero container ---------------- */
.hero{
  width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:12px 16px;position:relative;overflow:hidden;
  -webkit-user-select:none;-moz-user-select:none;user-select:none;
}

.sb-wrap{
  width:100%;max-width:1160px;
  display:flex;flex-direction:column;align-items:center;
  gap:12px;position:relative;z-index:2;
}

.sb-stage{
  width:100%;display:flex;align-items:center;justify-content:center;
  gap:clamp(10px,2vw,24px);position:relative;
  touch-action:pan-y;
}

/* Floating Navigation Buttons */
.sb-arrow{
  width:46px;height:46px;border-radius:50%;
  background:#faf8f5;border:1.5px solid var(--gold);
  color:var(--maroon);
  box-shadow:0 4px 16px rgba(106,37,43,.14),0 1px 4px rgba(0,0,0,.06);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;z-index:80;
  transition:all .22s cubic-bezier(0.2,0.8,0.2,1);
  -webkit-tap-highlight-color:transparent;
}
.sb-arrow:hover{
  background:#ffffff;border-color:var(--maroon);
  transform:scale(1.08);box-shadow:0 6px 20px rgba(106,37,43,.22);
}
.sb-arrow:active{transform:scale(0.94)}
.sb-arrow svg{width:18px;height:18px;display:block}

/* 3D Book Frame */
.sb-3d{
  position:relative;flex:0 1 auto;
  /* Book aspect ratio is 1760/1240 = 1.419 */
  /* Formula ensures book NEVER exceeds container height */
  width:min(960px,86vw,calc((100vh - 128px) * 1.419));
  perspective:1750px;perspective-origin:50% 46%;
}
.sb-tilt{
  position:relative;transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  will-change:transform;
}
.sb-book{
  position:relative;width:100%;aspect-ratio:1760/1240;
  transform-style:preserve-3d;z-index:1;
}

/* Shadow underneath book */
.sb-cast{position:absolute;pointer-events:none;z-index:0}
.sb-cast.ambient{
  left:5%;right:5%;top:27%;bottom:2%;
  background:radial-gradient(50% 50% at 50% 58%,
    rgba(58,44,26,.34) 0%,rgba(58,44,26,.19) 40%,rgba(58,44,26,0) 74%);
  filter:blur(26px);
  opacity:calc(1 - var(--shade,0) * .42);
}
.sb-cast.contact{
  left:9%;right:9%;top:62%;bottom:10%;
  background:radial-gradient(50% 44% at 50% 42%,
    rgba(44,32,14,.40) 0%,rgba(44,32,14,.17) 48%,rgba(44,32,14,0) 78%);
  filter:blur(11px);
  opacity:calc(1 - var(--shade,0) * .5);
}
.sb-cast.hair{
  left:12%;right:12%;top:70%;bottom:17%;
  background:radial-gradient(50% 52% at 50% 40%,
    rgba(40,28,10,.34) 0%,rgba(40,28,10,0) 76%);
  filter:blur(4px);
  opacity:calc(1 - var(--shade,0) * .62);
}

.sb-full{position:absolute;inset:0}
.sb-full img{width:100%;height:auto;display:block}
.sb-half{position:absolute;top:0;bottom:0;width:50%;overflow-x:clip;overflow-y:visible}
.sb-half.left{left:0}
.sb-half.right{left:50%}
.sb-half-img{width:200%;max-width:none;height:auto;display:block}
.sb-half-img.right{margin-left:-100%}

/* Gutter shading */
.gutter-shade{
  position:absolute;top:var(--pg,21.8%);bottom:var(--pg,21.8%);width:46%;
  pointer-events:none;opacity:calc(var(--shade,0) * .62);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 5.2%,#000 94.8%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 5.2%,#000 94.8%,transparent 100%);
}
.gutter-shade.left{right:0;background:linear-gradient(270deg,rgba(52,38,20,.30),rgba(52,38,20,0) 82%)}
.gutter-shade.right{left:0;background:linear-gradient(90deg,rgba(52,38,20,.24),rgba(52,38,20,0) 82%)}

/* ---- Turning leaf curved strips ---- */
.curl{
  position:absolute;top:0;height:100%;
  width:calc(var(--bw,0px) * var(--span));
  transform-style:preserve-3d;z-index:6;
}
.curl.next{left:50%;transform-origin:left center;transform:rotateY(calc(-1 * var(--tt,0deg)))}
.curl.prev{right:50%;transform-origin:right center;transform:rotateY(var(--tt,0deg))}
.strip{
  position:absolute;top:0;height:100%;
  width:calc(var(--bw,0px) * var(--span) / var(--n));
  transform-style:preserve-3d;
}
.curl.next .strip{transform-origin:left center}
.curl.prev .strip{transform-origin:right center}
.curl.next>.strip{left:0}
.curl.prev>.strip{right:0;left:auto}
.curl.next .strip .strip{left:100%;transform:rotateY(var(--td,0deg))}
.curl.prev .strip .strip{right:100%;transform:rotateY(calc(-1 * var(--td,0deg)))}
.face{
  position:absolute;top:0;bottom:0;left:0;right:-1.1px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background-repeat:no-repeat;background-size:var(--bw,0px) auto;
}
.face.back{transform:rotateY(180deg)}
.face .sh,.face .gl{
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 5.2%,#000 94.8%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 5.2%,#000 94.8%,transparent 100%);
}
.strip.edge .face .sh,.strip.edge .face .gl{
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 9%,#000 91%,transparent 100%),var(--hf);
  mask-image:linear-gradient(180deg,transparent 0,#000 9%,#000 91%,transparent 100%),var(--hf);
  -webkit-mask-composite:source-in;mask-composite:intersect;
}
.curl.next .strip.edge .face.front,.curl.prev .strip.edge .face.back{
  --hf:linear-gradient(90deg,#000 0 22%,transparent 96%);
}
.curl.next .strip.edge .face.back,.curl.prev .strip.edge .face.front{
  --hf:linear-gradient(270deg,#000 0 22%,transparent 96%);
}
.face .sh{position:absolute;left:0;right:0;top:var(--pg,21.8%);bottom:var(--pg,21.8%);pointer-events:none}
.curl.next .face.front .sh,.curl.prev .face.back .sh{
  background:linear-gradient(90deg,rgba(58,43,20,var(--a1,0)),rgba(58,43,20,var(--a2,0)));
}
.curl.next .face.back .sh,.curl.prev .face.front .sh{
  background:linear-gradient(90deg,rgba(58,43,20,var(--a2,0)),rgba(58,43,20,var(--a1,0)));
}
.face .gl{
  position:absolute;left:0;right:0;top:var(--pg,21.8%);bottom:var(--pg,21.8%);
  pointer-events:none;background:#fffaf0;
  opacity:calc(var(--shade,0) * var(--lit,1) * var(--lit,1) * .20);
}

/* Page Click Hit Targets */
.sb-zone{
  position:absolute;top:0;bottom:0;border:0;background:transparent;
  cursor:pointer;z-index:60;-webkit-tap-highlight-color:transparent;
}
.sb-prev-zone{left:0;width:50%}
.sb-next-zone{right:0;width:50%}

/* Captions */
.sb-captions{
  text-align:center;min-height:36px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;
}
.sb-caption-title{
  font-family:var(--display);font-size:clamp(18px,2.2vw,24px);
  color:var(--maroon);letter-spacing:0.04em;margin:0;line-height:1.2;
}
.sb-caption-sub{
  font-size:clamp(10.5px,1.1vw,12px);color:var(--ink-soft);
  letter-spacing:var(--track-caps);text-transform:uppercase;margin:0;
}

/* Pagination & Dots */
.sb-pagination-wrap{
  display:flex;flex-direction:column;align-items:center;
  gap:6px;
}
.sb-dots{
  display:flex;align-items:center;gap:8px;
}
.sb-dot{
  width:8px;height:8px;border-radius:4px;
  background:#d5caa0;border:none;padding:0;
  cursor:pointer;transition:all .25s ease;
  -webkit-tap-highlight-color:transparent;
}
.sb-dot:hover{background:var(--gold)}
.sb-dot.active{
  width:24px;background:var(--maroon);
  box-shadow:0 1px 4px rgba(106,37,43,.35);
}
.sb-counter{
  font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:500;
}

/* Responsive adjustments */
@media (max-width:768px){
  .hero{padding:8px 10px}
  .sb-wrap{gap:8px}
  .sb-stage{gap:0}
  .sb-arrow{
    width:40px;height:40px;position:absolute;top:50%;
    transform:translateY(-50%);background:rgba(250,248,245,.92);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    box-shadow:0 2px 10px rgba(60,30,20,.18);
  }
  .sb-arrow.left{left:6px}
  .sb-arrow.right{right:6px}
  .sb-arrow:hover{transform:translateY(-50%) scale(1.06)}
  .sb-arrow:active{transform:translateY(-50%) scale(0.92)}
  .sb-3d{width:min(96vw,560px,calc((100vh - 104px) * 1.419))}
}

@media (max-width:480px){
  .hero{padding:4px 6px}
  .sb-wrap{gap:6px}
  .sb-3d{width:min(98vw,440px,calc((100vh - 94px) * 1.419))}
  .sb-arrow{width:36px;height:36px}
  .sb-arrow svg{width:15px;height:15px}
  .sb-arrow.left{left:4px}
  .sb-arrow.right{right:4px}
  .sb-captions{min-height:30px}
  .sb-caption-title{font-size:17px}
  .sb-caption-sub{font-size:10px}
}
</style>
</head>
<body>
<div class="wash" aria-hidden="true"></div>

<main class="hero" id="sketchbook">
  <div class="sb-wrap" id="sbWrap">
    <div class="sb-stage" id="sbStage">
      <!-- Previous Arrow Button -->
      <button class="sb-arrow left" id="sbLeft" aria-label="Previous memory" title="Previous page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <!-- 3D Book Container -->
      <div class="sb-3d" id="sb3d">
        <div class="sb-tilt" id="sbTilt">
          <div class="sb-cast ambient" aria-hidden="true"></div>
          <div class="sb-cast contact" aria-hidden="true"></div>
          <div class="sb-cast hair" aria-hidden="true"></div>
          <div class="sb-book" id="sbBook"></div>
        </div>
      </div>

      <!-- Next Arrow Button -->
      <button class="sb-arrow right" id="sbRight" aria-label="Next memory" title="Next page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <!-- Captions -->
    <div class="sb-captions" id="sbCaptions">
      <h3 class="sb-caption-title" id="sbTitle">Sunlit Smiles</h3>
      <p class="sb-caption-sub" id="sbSub">The Simple Joy of Being Us</p>
    </div>

    <!-- Pagination Dots & Counter -->
    <div class="sb-pagination-wrap">
      <div class="sb-dots" id="sbDots" role="tablist" aria-label="Memory Pages"></div>
      <div class="sb-counter" id="sbCounter">Page 1 of 6</div>
    </div>
  </div>
</main>

<script>
const DIR = './';
const PAGES = [
  { file: 'plate-1.png', title: 'Sunlit Smiles',            place: 'The Simple Joy of Being Us' },
  { file: 'plate-2.png', title: 'Laughter in Little Things', place: 'Unfiltered & Full of Happiness' },
  { file: 'plate-3.png', title: 'Hand in Hand',             place: 'Sweet Everyday Journey' },
  { file: 'plate-4.png', title: 'Sweet Adventures',         place: 'Walking Through Life Together' },
  { file: 'plate-5.png', title: 'Forever & Always',         place: 'Two Hearts, One Journey' },
  { file: 'plate-6.png', title: 'Endless Smiles',           place: 'Santhosh & Shunmugapriya' }
];
PAGES.forEach(p => p.url = DIR + p.file);

// Pre-decode all images upfront so page turns never flash, drop frames, or glitch
const cachedImgs = {};
PAGES.forEach((p) => {
  const im = new Image();
  im.src = p.url;
  if (im.decode) im.decode().catch(() => {});
  cachedImgs[p.url] = im;
});

const M = PAGES.length;
let idx = 0;
let isBusy = false;
let turn = null; // { dir, from, to, t }
let lastTurnTime = 0;
const TURN_COOLDOWN = 550; // ms: prevent double-clicks or multi-turn glitch
let suppressClickUntil = 0;

const stage = document.getElementById('sbStage');
const sb3d = document.getElementById('sb3d');
const book = document.getElementById('sbBook');
const sbTitle = document.getElementById('sbTitle');
const sbSub = document.getElementById('sbSub');
const sbCounter = document.getElementById('sbCounter');
const sbDots = document.getElementById('sbDots');
const btnLeft = document.getElementById('sbLeft');
const btnRight = document.getElementById('sbRight');

/* ---------------- 3D strip curl math ---------------- */
const N = 18;
const SPAN = 0.449;
const BETA = 0.60;
let strips = [];

function el(t, c) {
  const e = document.createElement(t);
  if (c) e.className = c;
  return e;
}

function imgEl(i, side) {
  const cached = cachedImgs[PAGES[i].url];
  const im = cached ? cached.cloneNode(true) : new Image();
  im.className = 'sb-half-img ' + side;
  im.draggable = false;
  im.alt = '';
  if (!cached) im.src = PAGES[i].url;
  return im;
}

function halfEl(pos, i) {
  const d = el('div', 'sb-half ' + pos);
  d.appendChild(imgEl(i, pos));
  d.appendChild(el('div', 'gutter-shade ' + pos));
  return d;
}

function buildCurl(dir, from, to) {
  strips = [];
  const c = el('div', 'curl ' + dir);
  c.style.setProperty('--n', N);
  c.style.setProperty('--span', SPAN);
  let host = c;
  for (let i = 0; i < N; i++) {
    const s = el('div', 'strip');
    s.style.setProperty('--i', i);
    const gut = 'calc(var(--bw) * 0.5)';
    const sw = 'calc(var(--bw) * ' + SPAN + ' / ' + N + ')';
    const A = 'calc(-1 * (' + gut + ' + ' + i + ' * ' + sw + '))';
    const B = 'calc(' + (i + 1) + ' * ' + sw + ' - ' + gut + ')';
    const f = el('div', 'face front');
    const b = el('div', 'face back');
    const dress = (e, url, px) => {
      e.style.backgroundImage = 'url(' + url + ')';
      e.style.backgroundPositionX = px;
    };
    dress(f, PAGES[from].url, dir === 'next' ? A : B);
    dress(b, PAGES[to].url,   dir === 'next' ? B : A);
    f.appendChild(el('div', 'sh'));
    f.appendChild(el('div', 'gl'));
    b.appendChild(el('div', 'sh'));
    b.appendChild(el('div', 'gl'));
    s.appendChild(f);
    s.appendChild(b);
    if (i === N - 1) s.classList.add('edge');
    host.appendChild(s);
    host = s;
    strips.push(s);
  }
  return c;
}

function applyTurn(t) {
  const th = Math.PI * t;
  const beta = BETA * Math.sin(Math.PI * t);
  const D = 180 / Math.PI;
  const tt = th + beta;
  const td = (2 * beta) / N;
  sb3d.style.setProperty('--tt', (tt * D).toFixed(2) + 'deg');
  sb3d.style.setProperty('--td', (td * D).toFixed(3) + 'deg');
  sb3d.style.setProperty('--shade', Math.sin(Math.PI * t).toFixed(3));

  for (let i = 0; i < strips.length; i++) {
    const l1 = Math.abs(Math.cos(tt - i * td));
    const l2 = Math.abs(Math.cos(tt - (i + 1) * td));
    const st = strips[i].style;
    st.setProperty('--lit', l1.toFixed(3));
    st.setProperty('--a1', ((1 - l1) * 0.62).toFixed(3));
    st.setProperty('--a2', ((1 - l2) * 0.62).toFixed(3));
  }
}

function layout() {
  sb3d.style.setProperty('--bw', book.clientWidth + 'px');
}
window.addEventListener('resize', layout);

/* ---------------- render full or turning spread ---------------- */
function paint() {
  book.textContent = '';
  if (!turn) {
    const f = el('div', 'sb-full');
    const cached = cachedImgs[PAGES[idx].url];
    const im = cached ? cached.cloneNode(true) : new Image();
    im.className = '';
    im.src = PAGES[idx].url;
    im.alt = PAGES[idx].title;
    im.draggable = false;
    f.appendChild(im);
    book.appendChild(f);
    sb3d.style.setProperty('--shade', '0');
  } else {
    const next = turn.dir === 'next';
    book.appendChild(halfEl('left', next ? turn.from : turn.to));
    book.appendChild(halfEl('right', next ? turn.to : turn.from));
    book.appendChild(buildCurl(turn.dir, turn.from, turn.to));
    applyTurn(turn.t);
  }

  // Clickable interactive halves on the book itself
  const a = el('button', 'sb-zone sb-prev-zone');
  const b = el('button', 'sb-zone sb-next-zone');
  a.setAttribute('aria-label', 'Previous memory page');
  b.setAttribute('aria-label', 'Next memory page');

  a.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (performance.now() < suppressClickUntil) return;
    step('prev');
  });

  b.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (performance.now() < suppressClickUntil) return;
    step('next');
  });

  book.appendChild(a);
  book.appendChild(b);
  layout();
}

/* ---------------- update captions & indicators ---------------- */
function initDots() {
  sbDots.textContent = '';
  PAGES.forEach((p, i) => {
    const dot = el('button', 'sb-dot' + (i === idx ? ' active' : ''));
    dot.setAttribute('aria-label', `Go to page ${i + 1}: ${p.title}`);
    dot.addEventListener('click', (e) => {
      e.preventDefault();
      goTo(i);
    });
    sbDots.appendChild(dot);
  });
}

function updateUI() {
  const cur = turn ? turn.to : idx;
  const p = PAGES[cur];
  if (sbTitle) sbTitle.textContent = p.title;
  if (sbSub) sbSub.textContent = p.place;
  if (sbCounter) sbCounter.textContent = `Page ${cur + 1} of ${M}`;

  const dots = sbDots.querySelectorAll('.sb-dot');
  dots.forEach((d, i) => {
    d.classList.toggle('active', i === cur);
    d.setAttribute('aria-current', i === cur ? 'true' : 'false');
  });
}

/* ---------------- turning engine (smooth cubic easing) ---------------- */
function step(dir) {
  const now = performance.now();
  if (isBusy || turn !== null || (now - lastTurnTime < TURN_COOLDOWN)) return;
  lastTurnTime = now;
  isBusy = true;

  const from = idx;
  const to = dir === 'next' ? (from + 1) % M : (from - 1 + M) % M;
  turn = { dir: dir, from: from, to: to, t: 0 };
  paint();
  updateUI();

  const dur = 420; // ms: fast, crisp, photorealistic bend
  const startTime = performance.now();

  function anim(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(1, elapsed / dur);
    // Smoothstep cubic easing: 3p^2 - 2p^3
    const ease = progress * progress * (3 - 2 * progress);
    turn.t = ease;
    applyTurn(turn.t);

    if (progress < 1) {
      requestAnimationFrame(anim);
    } else {
      idx = to;
      turn = null;
      paint();
      updateUI();
      setTimeout(() => {
        isBusy = false;
      }, 150);
    }
  }
  requestAnimationFrame(anim);
}

function goTo(targetIdx) {
  if (isBusy || turn !== null || targetIdx === idx) return;
  const fwd = (targetIdx - idx + M) % M;
  const back = (idx - targetIdx + M) % M;
  if (fwd === 1) {
    step('next');
  } else if (back === 1) {
    step('prev');
  } else {
    isBusy = true;
    idx = targetIdx;
    paint();
    updateUI();
    setTimeout(() => {
      isBusy = false;
    }, 150);
  }
}

/* ---------------- event listeners ---------------- */
btnLeft.addEventListener('click', (e) => {
  e.preventDefault();
  e.stopPropagation();
  if (performance.now() < suppressClickUntil) return;
  step('prev');
});

btnRight.addEventListener('click', (e) => {
  e.preventDefault();
  e.stopPropagation();
  if (performance.now() < suppressClickUntil) return;
  step('next');
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') {
    e.preventDefault();
    step('next');
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    step('prev');
  }
});

/* ---------------- touch / mobile gestures ---------------- */
let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;
let isHorizSwipe = false;

stage.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartTime = performance.now();
  isHorizSwipe = false;
}, { passive: true });

stage.addEventListener('touchmove', (e) => {
  if (e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;

  // Intercept ONLY when explicitly swiping horizontally; allow vertical page scroll!
  if (Math.abs(dx) > Math.abs(dy) * 1.5 && Math.abs(dx) > 16) {
    isHorizSwipe = true;
    if (e.cancelable) e.preventDefault();
  }
}, { passive: false });

stage.addEventListener('touchend', (e) => {
  if (e.changedTouches.length !== 1) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;

  // 1. Horizontal swipe gesture ONLY
  if (isHorizSwipe && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.3) {
    suppressClickUntil = performance.now() + 500;
    if (dx < 0) step('next');
    else step('prev');
  }
  // Taps on the book or arrows are handled by native click listeners without duplicate firing!
}, { passive: true });

/* ---------------- desktop subtle 3D tilt ---------------- */
const TILT_X = 3.5, TILT_Y = 5.5;
let view = { rx: 0, ry: 0 };

function applyView() {
  sb3d.style.setProperty('--rx', view.rx.toFixed(2) + 'deg');
  sb3d.style.setProperty('--ry', view.ry.toFixed(2) + 'deg');
}

window.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch' || turn) return;
  const r = book.getBoundingClientRect();
  if (!r.width) return;
  const nx = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / (r.width * 0.65)));
  const ny = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height / 2)) / (r.height * 0.9)));
  view.rx = -ny * TILT_X;
  view.ry = nx * TILT_Y;
  applyView();
}, { passive: true });

window.addEventListener('pointerout', (e) => {
  if (!e.relatedTarget) {
    view.rx = 0;
    view.ry = 0;
    applyView();
  }
});

/* ---------------- initialize ---------------- */
initDots();
paint();
updateUI();
applyView();
</script>
